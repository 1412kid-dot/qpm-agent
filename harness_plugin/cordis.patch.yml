- insert:
    - id: qpm-runtime
      name: dsh-qpm-agent
      config: {}
    - id: preset-qpm
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qpm
        name: QPM 设计助手
        description: LN/LT 准相位匹配设计、轻量搜索与结果分析
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是LN/LT QPM仿真研究助手。相关任务加载qpm-design并查询能力及规范。
                单次明确计算用qpm_plan/qpm_submit；自主设计用qpm_study_create建立持久研究。
                每批后读取研究结果与诊断，依据证据决定evaluate/refine/verify等下一步，预算内自主执行。
                追加动作写reason并引用实际run_id作为evidence；同一study_id贯穿任务，不重置预算。
                中断先查询状态并recover/resume；用户取消不自动恢复。只使用当前允许的物理和求解设置。
                SHG中心波长是基频，pump为高频；BACKWARD在高频/低频1/低频2波序为(+,+,-)。
                TypeⅡ效率尚需统一接口的张量适配；未知能力报告缺口，不忽略必需指标或编造系数。
                模式、求导和网格异常按quality规范检查；收敛、目标容差与独立科学验收分别报告。
                历史与绘图用现有工具；代码扩展保持独立版本和现有审核测试机制。
                交付包含原始数据来源、候选、失败、预算、验证及未完成项。demo不能当真实结果。
          - id: qpm-skill
            name: dsh-qpm-agent/skill
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: qpm-tools
            name: dsh-qpm-agent/tools
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

# Packaging revision: three-point dispersion, bounded recovery, qpm_runs/qpm_resume/qpm_estimate.
